# Repo Radar — what to hunt for.
# Inferred from your repos (CLAUDE_MEMORY, knowledge-vault-mcp-server,
# claude-mcp-setup, video-vision, MEETING-EMOTION-ANALYSER, marketing-team,
# wipertech-comment-dashboard, session-signal, family-dashboard ...).
# Edit freely — add/remove queries and themes, then the next run picks them up.

settings:
  created_within_days: 120        # only repos created this recently count as "new"
  min_stars: 150                  # global popularity floor; a theme can override with its own min_stars
  per_theme: 3                    # headline "top momentum" picks per theme each digest
  rising_count: 2                 # extra "rising fast" picks per theme (small repos gaining stars over ~7d)
  rising_max_stars: 1500          # "small" ceiling for the rising-fast group
  rising_within_days: 7           # cold-start window: brand-new small repos count as risers until 7-day history accrues
  header_image: "https://raw.githubusercontent.com/MJB1000/repo-radar/main/assets/banner.png"  # banner atop each digest; empty = placeholder slot
  languages: []                   # optional allowlist e.g. [Python, TypeScript]; empty = any
  exclude_owners: [MJB1000]       # skip your own repos
  exclude_keywords:               # cut listicles, courses, curricula, dead mirrors
    - awesome
    - "awesome-"
    - roadmap
    - free-courses
    - interview
    - cheatsheet
    - "100-days"

# Each theme is a set of GitHub search queries. The script appends the recency +
# star floor automatically, sorts by stars, then re-ranks by momentum (stars/day).
# Query syntax = GitHub repo search: topic:x, "phrase in:name,description", language:x ...
themes:
  - name: AI agents & LLM tooling
    queries:
      - "topic:mcp"
      - "topic:model-context-protocol"
      - "topic:ai-agents"
      - "topic:agent-framework"
      - "topic:llm-agent"
      - "topic:rag"
      - "claude anthropic in:name,description,readme"
      - "mcp server in:name,description"

  - name: Multimodal AI
    queries:
      - "topic:multimodal"
      - "topic:vision-language-model"
      - "topic:video-understanding"
      - "topic:speech-to-text"
      - "emotion recognition in:name,description"
      - "video analysis in:name,description"

  - name: Marketing & analytics tech
    queries:
      - "topic:marketing-automation"
      - "topic:product-analytics"
      - "analytics dashboard in:name,description"
      - "attribution marketing in:name,description"
      - "sentiment analysis in:name,description"

  - name: Web/app dev stack
    queries:
      - "topic:supabase"
      - "topic:shadcn-ui"
      - "nextjs starter in:name,description"
      - "saas boilerplate in:name,description"

  - name: Self-development & productivity
    queries:
      - "topic:personal-knowledge-management"
      - "topic:second-brain"
      - "topic:productivity"
      - "topic:quantified-self"
      - "topic:zettelkasten"
      - "habit tracker in:name,description"
      - "life os in:name,description"

  - name: Claude & agent design craft
    min_stars: 80                 # niche corner — lower the floor so it isn't starved
    queries:
      - "topic:prompt-engineering"
      - "topic:context-engineering"
      - "claude code skill in:name,description"
      - "subagent OR multi-agent in:name,description"
      - "topic:llm-evaluation"
      - "agent design in:name,description"

  - name: Community & social media management
    queries:
      - "topic:social-media-management"
      - "topic:community-management"
      - "social media scheduler in:name,description"
      - "social media automation in:name,description"
      - "discord community bot in:name,description"

  - name: Customer-service AI agents
    queries:
      - "topic:customer-support"
      - "topic:conversational-ai"
      - "customer service agent in:name,description"
      - "support ticket ai in:name,description"
      - "helpdesk ai in:name,description"
      - "ai chatbot support in:name,description"

  - name: Meta inbox & omnichannel AI agents
    min_stars: 40                 # emerging niche — low floor to catch early entrants
    queries:
      - "topic:chatwoot"
      - "topic:whatsapp-bot"
      - "omnichannel inbox in:name,description"
      - "instagram dm in:name,description"
      - "messenger bot ai in:name,description"
      - "social inbox ai in:name,description"
      - "lead qualification ai in:name,description"

  - name: Wildcard — adjacent leverage
    # Not in your stated lanes, but areas I think give you leverage: automation to
    # wire your tools together, browser/computer-use agents, agent reliability,
    # voice agents, design-to-code, and self-hosted breakouts. Retune or drop freely.
    queries:
      - "topic:workflow-automation"
      - "topic:browser-automation"
      - "topic:ai-observability"
      - "topic:voice-assistant"
      - "topic:design-to-code"
      - "topic:self-hosted"

  - name: Ads & paid growth
    queries:
      - "topic:facebook-ads"
      - "topic:google-ads"
      - "topic:digital-advertising"
      - "meta ads in:name,description"
      - "ad creative generator in:name,description"
      - "paid media in:name,description"

  - name: Short-form video & content production
    queries:
      - "topic:video-editing"
      - "topic:short-video"
      - "topic:tiktok"
      - "captions generator in:name,description"
      - "reels in:name,description"
      - "storyboard ai in:name,description"

  - name: E-commerce & Shopify
    queries:
      - "topic:shopify"
      - "topic:ecommerce"
      - "topic:headless-commerce"
      - "shopify app in:name,description"
      - "product feed in:name,description"

  - name: Brand systems & creative ops
    queries:
      - "topic:design-system"
      - "topic:brand-guidelines"
      - "brand assets in:name,description"
      - "digital asset management in:name,description"
      - "creative automation in:name,description"

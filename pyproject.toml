[project]
name = "scheduled-prompt-deployment"
version = "0.1.0"
description = "Deploy a Claude prompt on a recurring schedule against a specific project"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.45.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
scheduled-prompt = "scheduled_prompt.main:main"
